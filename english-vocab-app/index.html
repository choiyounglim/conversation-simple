<title>그림 영단어 카드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 그림책 단어장 — 상단 탭(단어장·학습·퀴즈·추가), 카드 그리드는 그림 패널 + 단어/발음/뜻 */
:root {
  --paper: #f5f7fb;
  --card: #ffffff;
  --ink: #1d2433;
  --muted: #677086;
  --line: #dfe4ee;
  --word: #24439b;      /* 영어 단어: 남색 */
  --mean: #e0453a;      /* 한국어 뜻: 빨강 */
  --good: #1f9d6b;
  --tint-1: #fff4c7; --tint-2: #e3f1dc; --tint-3: #d9eef3; --tint-4: #fde3dc; --tint-5: #ece6fb;
  --f-en: "Fredoka", "Noto Sans KR", system-ui, sans-serif;
  --f-ko: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151c; --card: #1b2029; --ink: #e9ecf3; --muted: #9aa3b7; --line: #2c3340;
    --word: #8fa8ff; --mean: #ff7b70; --good: #4cc995;
    --tint-1: #3a3420; --tint-2: #233226; --tint-3: #1f3238; --tint-4: #3a2622; --tint-5: #2b2640;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151c; --card: #1b2029; --ink: #e9ecf3; --muted: #9aa3b7; --line: #2c3340;
  --word: #8fa8ff; --mean: #ff7b70; --good: #4cc995;
  --tint-1: #3a3420; --tint-2: #233226; --tint-3: #1f3238; --tint-4: #3a2622; --tint-5: #2b2640;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--f-ko); font-weight: 400; font-size: 1.9rem; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 .en { font-family: var(--f-en); color: var(--word); font-weight: 700; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: .9rem; }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button { font: 500 .92rem var(--f-body); border: 1.5px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
nav button[aria-pressed="true"] { background: var(--word); border-color: var(--word); color: var(--paper); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--mean); outline-offset: 2px; }
.stats { margin: 18px 0 14px; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.stats b { color: var(--good); }

/* 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.pic { position: relative; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; }
.pic .emoji { font-size: 4.6rem; line-height: 1; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.tag { position: absolute; display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; }
.tag .ko { font-family: var(--f-ko); color: var(--ink); font-size: 1.25rem; }
.tag .en { font-family: var(--f-en); color: var(--word); font-size: .85rem; border-top: 1.5px solid currentColor; padding-top: 1px; }
.tag.l { left: 10%; top: 14%; transform: rotate(-8deg); }
.tag.m { right: 9%; top: 12%; }
.tag.m .ko { color: var(--mean); font-size: 1rem; }
.body { padding: 12px 14px 14px; display: grid; gap: 4px; }
.row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.word { font-family: var(--f-en); font-weight: 700; color: var(--word); font-size: 1.6rem; line-height: 1.1; }
.mean { font-family: var(--f-ko); color: var(--mean); font-size: 1.2rem; }
.ipa { color: var(--muted); font-size: .85rem; }
.hint { color: var(--ink); font-size: .88rem; margin: 2px 0 0; }
.tools { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.icon-btn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 4px 10px; font: 500 .82rem var(--f-body); cursor: pointer; }
.known { margin-left: auto; font-size: .78rem; color: var(--good); font-weight: 700; }

/* 학습 · 퀴즈 */
.stage { max-width: 420px; margin: 8px auto 0; display: grid; gap: 14px; }
.stage .card .pic .emoji { font-size: 6.5rem; }
.stage .word { font-size: 2.3rem; }
.cover { border: 2px dashed var(--line); border-radius: 10px; padding: 10px; text-align: center; color: var(--muted); cursor: pointer; background: transparent; font: inherit; width: 100%; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big { font: 700 1rem var(--f-body); padding: 13px; border-radius: 12px; border: 0; cursor: pointer; color: var(--paper); }
.big.no { background: var(--mean); }
.big.yes { background: var(--good); }
.progress { text-align: center; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { font: 600 1.25rem var(--f-en); color: var(--word); background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px 8px; cursor: pointer; }
.choice.right { border-color: var(--good); background: var(--tint-2); }
.choice.wrong { border-color: var(--mean); background: var(--tint-4); }
.feedback { text-align: center; min-height: 1.5em; font-weight: 700; }

/* 추가 폼 */
form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; max-width: 560px; display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }
input, select { font: 1rem var(--f-body); padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); width: 100%; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .two { grid-template-columns: 1fr; } }
.note { color: var(--muted); font-size: .82rem; margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } .grid .card:hover { transform: translateY(-2px); } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>그림으로 외우는 <span class="en">Words</span></h1>
      <p class="sub">소리가 비슷한 우리말과 그림으로 단어를 기억해요</p>
    </div>
    <nav aria-label="메뉴">
      <button data-view="list" aria-pressed="true">단어장</button>
      <button data-view="study" aria-pressed="false">카드 학습</button>
      <button data-view="quiz" aria-pressed="false">그림 퀴즈</button>
      <button data-view="add" aria-pressed="false">단어 추가</button>
    </nav>
  </header>

  <section id="v-list">
    <p class="stats" id="stats"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="v-study" hidden>
    <div class="stage" id="study"></div>
  </section>

  <section id="v-quiz" hidden>
    <div class="stage" id="quiz"></div>
  </section>

  <section id="v-add" hidden>
    <p class="stats">나만의 단어 카드를 만들어요. 사진을 넣으면 그림 대신 사진이 보여요.</p>
    <form id="addForm">
      <div class="two">
        <label for="f-word">영어 단어<input id="f-word" required placeholder="dolphin"></label>
        <label for="f-mean">뜻<input id="f-mean" required placeholder="돌고래"></label>
      </div>
      <div class="two">
        <label for="f-ipa">발음기호 (선택)<input id="f-ipa" placeholder="dɑ́lfin"></label>
        <label for="f-emoji">그림 이모지<input id="f-emoji" placeholder="🐬" maxlength="8"></label>
      </div>
      <div class="two">
        <label for="f-sound">비슷한 우리말 소리<input id="f-sound" placeholder="달핀"></label>
        <label for="f-photo">사진 (선택)<input id="f-photo" type="file" accept="image/*"></label>
      </div>
      <label for="f-hint">기억 문장<input id="f-hint" placeholder="달에 핀 꽃까지 점프하는 돌고래"></label>
      <button class="big yes" type="submit">카드 만들기</button>
      <p class="note">로그인한 claude.ai 계정에 저장되어 휴대폰과 PC에서 같이 볼 수 있어요.</p>
    </form>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const BASE = [
  { word: "chick", ipa: "tʃik", mean: "병아리", emoji: "🐥", sound: "짹!", hint: "병아리가 짹! 짹! 하고 울어요." },
  { word: "sparrow", ipa: "spǽrou", mean: "참새", emoji: "🐦", sound: "숲에로", hint: "참새가 숲에로 날아가요." },
  { word: "shark", ipa: "ʃɑːrk", mean: "상어", emoji: "🦈", sound: "샥!", hint: "상어 지느러미가 샥! 샥! 지나가요." },
  { word: "bear", ipa: "bɛər", mean: "곰", emoji: "🐻", sound: "베어", hint: "곰이 꿀을 한 입 베어 먹어요." },
  { word: "whale", ipa: "weil", mean: "고래", emoji: "🐳", sound: "웨일", hint: "고래야, 웨일(왜 이리) 커?" },
  { word: "tiger", ipa: "táigər", mean: "호랑이", emoji: "🐯", sound: "타! 이거", hint: "\"타! 이거\" 호랑이 등에 올라타요." },
  { word: "monkey", ipa: "mʌ́ŋki", mean: "원숭이", emoji: "🐵", sound: "멍키", hint: "멍하니 키득거리는 원숭이." },
  { word: "owl", ipa: "aul", mean: "부엉이", emoji: "🦉", sound: "아울~", hint: "밤마다 부엉이가 아울~ 하고 울어요." },
  { word: "mouse", ipa: "maus", mean: "쥐", emoji: "🐭", sound: "마우스", hint: "컴퓨터 마우스는 쥐를 닮았어요." },
  { word: "duck", ipa: "dʌk", mean: "오리", emoji: "🦆", sound: "덕분에", hint: "오리 덕분에 연못이 시끌벅적해요." },
  { word: "frog", ipa: "frɔːg", mean: "개구리", emoji: "🐸", sound: "풀옥", hint: "풀 옥상 위로 개구리가 폴짝!" },
  { word: "snake", ipa: "sneik", mean: "뱀", emoji: "🐍", sound: "스윽 내 크", hint: "스윽~ 내 키보다 큰 뱀이 지나가요." },
];
const KEY_CARDS = "picwords.cards", KEY_KNOWN = "picwords.known";
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
let custom = load(KEY_CARDS, []);
let known = new Set(load(KEY_KNOWN, []));
const all = () => [...BASE, ...custom];
const tint = i => `var(--tint-${(i % 5) + 1})`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);

function speak(w) {
  try {
    const u = new SpeechSynthesisUtterance(w);
    u.lang = "en-US"; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch {}
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 1800);
}

function picHTML(c, i, { showMean = true } = {}) {
  const art = c.photo ? `<img src="${c.photo}" alt="${esc(c.word)} 사진">` : `<span class="emoji" aria-hidden="true">${esc(c.emoji || "🖼️")}</span>`;
  const tagSound = c.sound ? `<span class="tag l"><span class="ko">${esc(c.sound)}</span><span class="en">${esc(c.word)}</span></span>` : "";
  const tagMean = showMean ? `<span class="tag m"><span class="ko">${esc(c.mean)}</span></span>` : "";
  return `<div class="pic" style="background:${tint(i)}">${art}${tagSound}${tagMean}</div>`;
}

function cardHTML(c, i) {
  return `<article class="card">
    ${picHTML(c, i)}
    <div class="body">
      <div class="row"><span class="word">${esc(c.word)}</span><span class="mean">${esc(c.mean)}</span></div>
      ${c.ipa ? `<span class="ipa">[${esc(c.ipa)}]</span>` : ""}
      ${c.hint ? `<p class="hint">${esc(c.hint)}</p>` : ""}
      <div class="tools">
        <button class="icon-btn" data-say="${esc(c.word)}">🔊 듣기</button>
        ${c.custom ? `<button class="icon-btn" data-del="${esc(c.id)}">삭제</button>` : ""}
        ${known.has(c.word) ? `<span class="known">외웠어요 ✓</span>` : ""}
      </div>
    </div>
  </article>`;
}

function renderList() {
  const cards = all();
  $("grid").innerHTML = cards.map(cardHTML).join("");
  const k = cards.filter(c => known.has(c.word)).length;
  const where = col ? "☁️ 내 계정에 저장 · 휴대폰과 PC에서 같이 보여요" : "이 기기에만 저장돼요";
  $("stats").innerHTML = `단어 ${cards.length}개 · 외운 단어 <b>${k}</b>개 · ${where}`;
}

// 카드 학습: 아직 못 외운 카드부터 섞어서
let deck = [], pos = 0, revealed = false;
function startStudy() {
  const cards = all().map((c, i) => ({ c, i }));
  const todo = cards.filter(x => !known.has(x.c.word));
  deck = shuffle(todo.length ? todo : cards); pos = 0; revealed = false; renderStudy();
}
function renderStudy() {
  const el = $("study");
  if (pos >= deck.length) {
    el.innerHTML = `<p class="progress">한 바퀴 끝! 외운 단어 ${all().filter(c => known.has(c.word)).length} / ${all().length}</p>
      <button class="big yes" id="again">다시 하기</button>`;
    $("again").onclick = startStudy; return;
  }
  const { c, i } = deck[pos];
  el.innerHTML = `<p class="progress">${pos + 1} / ${deck.length}</p>
    <article class="card">
      ${picHTML(c, i, { showMean: revealed })}
      <div class="body">
        <div class="row"><span class="word">${esc(c.word)}</span>${revealed ? `<span class="mean">${esc(c.mean)}</span>` : ""}</div>
        ${c.ipa ? `<span class="ipa">[${esc(c.ipa)}]</span>` : ""}
        ${revealed ? (c.hint ? `<p class="hint">${esc(c.hint)}</p>` : "") : `<button class="cover" id="reveal">눌러서 뜻 보기</button>`}
        <div class="tools"><button class="icon-btn" data-say="${esc(c.word)}">🔊 듣기</button></div>
      </div>
    </article>
    <div class="actions">
      <button class="big no" id="nope">아직 몰라요</button>
      <button class="big yes" id="got">외웠어요</button>
    </div>`;
  if (!revealed) $("reveal").onclick = () => { revealed = true; renderStudy(); speak(c.word); };
  $("nope").onclick = () => { known.delete(c.word); saveKnown(); next(); };
  $("got").onclick = () => { known.add(c.word); saveKnown(); next(); };
}
function next() { pos++; revealed = false; renderStudy(); }

// 그림 퀴즈: 그림+뜻을 보고 영어 단어 고르기
let qScore = 0, qCount = 0;
function renderQuiz() {
  const cards = all();
  const i = Math.floor(Math.random() * cards.length), c = cards[i];
  const others = shuffle(cards.filter(x => x.word !== c.word)).slice(0, 3);
  const opts = shuffle([c, ...others]);
  $("quiz").innerHTML = `<p class="progress">맞힌 개수 ${qScore} / ${qCount}</p>
    <article class="card">
      ${picHTML({ ...c, sound: "" }, i)}
      <div class="body"><div class="row"><span class="mean">${esc(c.mean)}</span><span class="ipa">은(는) 영어로?</span></div></div>
    </article>
    <div class="choices">${opts.map(o => `<button class="choice" data-w="${esc(o.word)}">${esc(o.word)}</button>`).join("")}</div>
    <p class="feedback" id="fb"></p>`;
  $("quiz").querySelectorAll(".choice").forEach(b => b.onclick = () => {
    if ($("quiz").dataset.done === "1") return;
    $("quiz").dataset.done = "1"; qCount++;
    const ok = b.dataset.w === c.word;
    if (ok) qScore++;
    b.classList.add(ok ? "right" : "wrong");
    $("quiz").querySelector(`[data-w="${CSS.escape(c.word)}"]`).classList.add("right");
    $("fb").textContent = ok ? "정답! 👏" : `정답은 ${c.word} — ${c.hint || ""}`;
    $("fb").style.color = ok ? "var(--good)" : "var(--mean)";
    speak(c.word);
    setTimeout(() => { $("quiz").dataset.done = "0"; renderQuiz(); }, ok ? 1100 : 2400);
  });
}

function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function show(view) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));
  ["list", "study", "quiz", "add"].forEach(v => $("v-" + v).hidden = v !== view);
  if (view === "list") renderList();
  if (view === "study") startStudy();
  if (view === "quiz") { $("quiz").dataset.done = "0"; renderQuiz(); }
}
document.querySelector("nav").onclick = e => { const v = e.target.closest("button")?.dataset.view; if (v) show(v); };
document.addEventListener("click", e => {
  const say = e.target.closest("[data-say]"); if (say) speak(say.dataset.say);
  const del = e.target.closest("[data-del]");
  if (del) { removeCard(del.dataset.del); renderList(); toast("카드를 삭제했어요"); }
});

// 사진은 작게 줄여서 저장
function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, 480 / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", 0.8));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = id => $(id).value.trim();
  const file = $("f-photo").files[0];
  let photo = "";
  if (file) { try { photo = await shrink(file); } catch { toast("사진을 읽지 못했어요. 다른 사진을 골라 주세요"); return; } }
  const card = { id: "card-" + Date.now(), custom: true, word: f("f-word"), mean: f("f-mean"), ipa: f("f-ipa"),
    emoji: f("f-emoji") || "🖼️", sound: f("f-sound"), hint: f("f-hint"), photo };
  custom.push(card);
  const ok = await addCard(card);
  e.target.reset();
  toast(ok ? "카드를 만들었어요" : "카드를 만들었지만 저장하지 못했어요");
  show("list");
});

// 저장: 계정 동기화(db)가 되면 계정에, 아니면 이 브라우저에
let col = null, writes = Promise.resolve();
const queue = fn => (writes = writes.then(fn).catch(err => { toast(err?.code === "quota_exceeded" ? "저장 공간이 가득 찼어요. 카드를 몇 개 지워 주세요" : "저장하지 못했어요. 잠시 후 다시 해 주세요"); return false; }));
function saveKnown() {
  if (col) queue(() => col.doc("progress").set({ known: [...known] }));
  else save(KEY_KNOWN, [...known]);
}
async function addCard(card) {
  if (!col) return save(KEY_CARDS, custom);
  const { id, ...body } = card;
  return (await queue(() => col.doc(id).set({ kind: "card", ...body }).then(() => true))) === true;
}
function removeCard(id) {
  custom = custom.filter(c => c.id !== id);
  if (col) queue(() => col.doc(id).delete());
  else save(KEY_CARDS, custom);
}
async function connect() {
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  const uid = db && user ? await user.id() : null;
  if (!uid) return;
  col = db.collection("data/users/" + uid);
  // 이 기기에만 있던 카드와 기록을 계정으로 옮기기
  const localCards = load(KEY_CARDS, []), localKnown = load(KEY_KNOWN, []);
  if (localCards.length || localKnown.length) {
    const prog = await col.doc("progress").get().catch(() => null);
    const merged = new Set([...(prog?.data()?.known || []), ...localKnown]);
    await queue(async () => {
      for (const c of localCards) { const { id, ...body } = c; await col.doc(String(id).startsWith("card-") ? id : "card-" + id).set({ kind: "card", ...body }); }
      if (localKnown.length) await col.doc("progress").set({ known: [...merged] });
      try { localStorage.removeItem(KEY_CARDS); localStorage.removeItem(KEY_KNOWN); } catch {}
    });
  }
  col.onSnapshot(snap => {
    const cards = [];
    let k = [];
    snap.docs.forEach(d => {
      const v = d.data();
      if (d.id === "progress") k = v.known || [];
      else if (v.kind === "card") cards.push({ ...v, id: d.id, custom: true });
    });
    custom = cards.sort((a, b) => a.id.localeCompare(b.id));
    known = new Set(k);
    if (!$("v-list").hidden) renderList();
  }, () => { col = null; renderList(); });
  renderList();
}

renderList();
connect();
</script>
